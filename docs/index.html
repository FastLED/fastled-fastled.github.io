<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FastLED documentation has moved</title>
  <link rel="canonical" href="https://fastled.github.io/dox/">
  <script>
    const match = window.location.pathname.match(/^\/(?:fastled-fastled\.github\.io\/)?docs(?:\/(.*))?$/);
    if (match) {
      window.location.replace('https://fastled.github.io/dox/' + (match[1] || '') + window.location.search + window.location.hash);
    }
  </script>
  <meta http-equiv="refresh" content="0; url=https://fastled.github.io/dox/">
</head>
<body><p><a href="https://fastled.github.io/dox/">Open the FastLED API reference</a>.</p></body>
</html>
