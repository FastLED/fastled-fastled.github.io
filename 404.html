<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — FastLED</title>
  <script>
    const match = window.location.pathname.match(/^\/(?:fastled-fastled\.github\.io\/)?docs(?:\/(.*))?$/);
    if (match) {
      window.location.replace('https://fastled.github.io/dox/' + (match[1] || '') + window.location.search + window.location.hash);
    }
  </script>
</head>
<body>
  <h1>Page not found</h1>
  <p>Visit the <a href="/">FastLED homepage</a> or the
  <a href="https://fastled.github.io/dox/">FastLED API reference</a>.</p>
</body>
</html>
